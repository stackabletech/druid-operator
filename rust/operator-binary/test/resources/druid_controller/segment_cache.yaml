---
apiVersion: druid.stackable.tech/v1alpha1
kind: DruidCluster
metadata:
  name: test-resource-merge
  namespace: default
  uid: 7d1c3f0a-5b2e-4c8d-9e6f-0a1b2c3d4e5f
spec:
  image:
    productVersion: 37.0.0
  clusterConfig:
    deepStorage:
      s3:
        bucket:
          inline:
            bucketName: druid
            connection:
              inline:
                host: minio-druid
                port: 9000
                accessStyle: Path
                credentials:
                  secretClass: druid-s3-credentials
    metadataDatabase:
      postgresql:
        host: druid-postgresql
        database: druid
        credentialsSecretName: mySecret
    zookeeperConfigMapName: psql-druid-znode
  brokers:
    roleGroups:
      default:
        replicas: 1
  coordinators:
    roleGroups:
      default:
        replicas: 1
  historicals:
    roleGroups:
      default:
        replicas: 1
      secondary:
        replicas: 1
        config:
          resources:
            storage:
              segmentCache:
                freePercentage: 2
                emptyDir:
                  capacity: 5G
  middleManagers:
    roleGroups:
      default:
        replicas: 1
  routers:
    roleGroups:
      default:
        replicas: 1
