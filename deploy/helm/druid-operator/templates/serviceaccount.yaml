---
{{ if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "druid-operator.serviceAccountName" . }}
  labels:
    {{- include "druid-operator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
# Grants the operator ServiceAccount the ClusterRole from roles.yaml, which is what lets the
# operator watch and manage its custom resources across the cluster.
kind: ClusterRoleBinding
metadata:
  name: {{ include "druid-operator.fullname" . }}-clusterrolebinding
  labels:
    {{- include "druid-operator.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "druid-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "druid-operator.fullname" . }}-clusterrole
  apiGroup: rbac.authorization.k8s.io
