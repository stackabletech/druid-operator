---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: test-druid
  labels:
    app: test-druid
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-druid
  template:
    metadata:
      labels:
        app: test-druid
    spec:
      containers:
        - name: test-druid
          image: oci.stackable.tech/sdp/testing-tools:0.4.0-stackable26.11.0
          command: ["sleep", "infinity"]
      terminationGracePeriodSeconds: 1
