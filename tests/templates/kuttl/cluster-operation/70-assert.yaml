---
# The recreated StatefulSets must bring the cluster back to ready, and the recreated
# objects must carry an owner reference back to the DruidCluster so that garbage
# collection still works for them.
apiVersion: kuttl.dev/v1beta1
kind: TestAssert
metadata:
  name: recreate-owned-resources
timeout: 600
commands:
  - script: kubectl -n $NAMESPACE wait --for=condition=available druidclusters.druid.stackable.tech/derby-druid --timeout 601s
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: derby-druid-broker-default
  ownerReferences:
    - apiVersion: druid.stackable.tech/v1alpha1
      controller: true
      kind: DruidCluster
      name: derby-druid
status:
  readyReplicas: 1
  replicas: 1
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
